<body>
    <h2>Add Transaction</h2>
    <form action="addTransaction.html" class="transactionField" id="transactionField">
        <label for="transactionName">Name of transaction</label>
        <input type="text" name="transactionName" id="transactionName">
        <label for="typeOfTransaction">Type of transaction</label>
        <select name="typeOfTransaction" id="typeOfTransaction">
            <option value="Food">Food</option>
            <option value="Bill">Bill</option>
            <option value="Salary">Salary</option>
            <option value="Electronics">Electronics</option>
            <option value="Entertainment">Entertainment</option>
        </select>
        <label for="transactionDate">Date of transaction</label>
        <input type="date" name="transactionDate" id="transactionDate" placeholder="Date of the transaction">
        <label for="transactionAmmount">Ammount of transaction</label>
        <input type="number" name="transactionAmmount" id="transactionAmmount">
        <input type="submit" value="Add Transaction" id="addTransactionBtn">
    </form>
</body>
